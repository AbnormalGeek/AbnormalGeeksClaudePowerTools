name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: leak-check (working tree)
        run: tools/leak-check.sh

      - name: leak-check test suite
        run: tools/test/leak-check-test.sh

      - name: subagent-liveliness hook test suite
        run: claude-config/hooks/test/subagent-liveliness-test.sh

      - name: gen-persona-skills test suite
        run: tools/test/gen-persona-skills-test.sh

      - name: pre-push hook test suite
        run: tools/test/pre-push-test.sh

      - name: gen-persona-skills --check (generated skills in sync)
        run: tools/gen-persona-skills.sh --check

      - name: Shell syntax check (bash -n)
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || status=1
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: install.sh --dry-run sanity
        run: ./install.sh --dry-run --yes
